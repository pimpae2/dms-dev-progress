<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งค่าชีต | Project Progress</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=dynamic-plans">
</head>
<body data-page="plan-settings">
  <header class="settings-header"><div><p class="eyebrow">Project Progress</p><h1>ตั้งค่าชีต</h1></div><a class="settings-link" href="/project_plan">ดู Progress ↗</a></header>
  <main class="settings-layout">
    <section aria-labelledby="sourcesTitle">
      <div class="section-head"><h2 id="sourcesTitle">ชุดข้อมูล</h2><button type="button" id="newPlan" class="settings-button">+ เพิ่มชุดข้อมูล</button></div>
      <p id="settingsMessage" role="status" aria-live="polite">กำลังอ่านค่าตั้งค่า</p>
      <form id="adminLogin" hidden>
        <label for="adminToken">รหัสผู้ดูแล</label>
        <input id="adminToken" type="password" autocomplete="current-password" required>
        <button class="settings-button" type="submit">เข้าสู่ระบบ</button>
      </form>
      <button id="adminLogout" class="settings-button" type="button" hidden>ออกจากระบบ</button>
      <div id="settingsList"></div>
    </section>
    <section class="settings-editor" aria-labelledby="editorTitle">
      <h2 id="editorTitle">เพิ่มชุดข้อมูล</h2>
      <form id="planForm">
        <label for="planName">ชื่อระบบ / ชื่อแท็บ</label><input id="planName" name="name" required maxlength="100" autocomplete="off">
        <label for="planUrl">ลิงก์ Google Sheet</label><input id="planUrl" name="url" type="url" required placeholder="https://docs.google.com/spreadsheets/d/…/edit?gid=…">
        <label class="checkbox-label"><input id="planEnabled" type="checkbox" checked>เปิดแสดงในหน้า Progress</label>
        <button class="settings-button" type="button" id="checkPlan">ตรวจสอบข้อมูล</button>
        <div id="planPreview" role="status" aria-live="polite"></div>
        <div class="settings-actions"><button class="settings-button primary" type="submit" id="savePlan" disabled>บันทึก</button><button class="settings-button" type="button" id="cancelPlan">ยกเลิก</button></div>
      </form>
    </section>
  </main>
  <script src="plan-config.js?v=dynamic-plans"></script><script src="project-progress.js?v=dynamic-plans"></script><script src="script.js?v=dynamic-plans"></script><script src="plan-settings.js?v=dynamic-plans"></script>
</body>
</html>
